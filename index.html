<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Daily Planner">
    <title>DAILY PLANNER</title>
    <link id="appleTouchIconLink" rel="apple-touch-icon" sizes="180x180" href="">
    <link id="faviconLink" rel="icon" type="image/png" sizes="180x180" href="">
    <script>
        (function() {
            try {
                const c = document.createElement('canvas');
                c.width = 180;
                c.height = 180;
                const ctx = c.getContext('2d');
                const s = 180 / 120;

                const rRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                };

                ctx.fillStyle = '#EEF2F6';
                ctx.fillRect(0, 0, 180, 180);

                rRect(10 * s, 10 * s, 100 * s, 100 * s, 22 * s);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();

                ctx.fillStyle = 'rgba(147, 213, 246, 0.78)';
                ctx.fillRect(20 * s, 46 * s, 44 * s, 17 * s);

                ctx.fillStyle = 'rgba(253, 224, 114, 0.82)';
                ctx.fillRect(20 * s, 72 * s, 38 * s, 11 * s);

                rRect(80 * s, 41 * s, 22 * s, 18 * s, 4 * s);
                ctx.fillStyle = '#F9A8C9';
                ctx.fill();

                rRect(80 * s, 64 * s, 22 * s, 15 * s, 4 * s);
                ctx.fillStyle = '#99E6C3';
                ctx.fill();

                rRect(80 * s, 84 * s, 22 * s, 16 * s, 4 * s);
                ctx.fillStyle = '#D1B3FC';
                ctx.fill();

                ctx.strokeStyle = '#94A3B8';
                ctx.lineWidth = 4 * s;
                ctx.beginPath();
                ctx.moveTo(10 * s, 34 * s); ctx.lineTo(110 * s, 34 * s);
                ctx.moveTo(42 * s, 10 * s); ctx.lineTo(42 * s, 34 * s);
                ctx.moveTo(74 * s, 34 * s); ctx.lineTo(74 * s, 110 * s);
                ctx.stroke();

                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.arc(26 * s, 22 * s, 3.8 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1E293B';
                ctx.lineWidth = 5.5 * s;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(25 * s, 55 * s);
                ctx.lineTo(31.5 * s, 61.5 * s);
                ctx.lineTo(44 * s, 48 * s);
                ctx.stroke();

                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 4 * s;
                ctx.beginPath();
                ctx.moveTo(22 * s, 77.5 * s); ctx.lineTo(54 * s, 77.5 * s);
                ctx.stroke();

                ctx.strokeStyle = '#94A3B8';
                ctx.beginPath();
                ctx.moveTo(22 * s, 94 * s); ctx.lineTo(45 * s, 94 * s);
                ctx.stroke();

                rRect(10 * s, 10 * s, 100 * s, 100 * s, 22 * s);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 5.5 * s;
                ctx.stroke();

                const pngUrl = c.toDataURL('image/png');
                const tLink = document.getElementById('appleTouchIconLink');
                const fLink = document.getElementById('faviconLink');
                if (tLink) tLink.href = pngUrl;
                if (fLink) fLink.href = pngUrl;
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #ffffff;
            --line-light: #d4d4d8;
            --line-cat: #a1a1aa;
            --line-strong: #9ca3af;
            --ink-primary: #334155;
            --ink-muted: #71717a;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at 18% 12%, rgba(215, 235, 255, 0.7) 0%, transparent 45%),
                        radial-gradient(circle at 82% 88%, rgba(255, 226, 240, 0.65) 0%, transparent 45%),
                        #eaeef3;
            color: var(--ink-primary);
            overflow: hidden;
        }

        .app-viewport {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .liquid-glass-modal {
            background: rgba(255, 255, 255, 0.52);
            backdrop-filter: blur(40px) saturate(220%) brightness(1.04);
            -webkit-backdrop-filter: blur(40px) saturate(220%) brightness(1.04);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 32px 80px -15px rgba(15, 23, 42, 0.28),
                        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
                        inset 0 -1.5px 2px rgba(0, 0, 0, 0.04);
        }

        .liquid-glass-widget {
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(48px) saturate(230%) brightness(1.05);
            -webkit-backdrop-filter: blur(48px) saturate(230%) brightness(1.05);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 36px 90px -16px rgba(15, 23, 42, 0.26),
                        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
                        inset 0 -1px 2px rgba(0, 0, 0, 0.03);
        }

        .liquid-glass-subcard {
            background: rgba(255, 255, 255, 0.42);
            backdrop-filter: blur(20px) saturate(190%);
            -webkit-backdrop-filter: blur(20px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.92),
                        0 4px 14px -3px rgba(15, 23, 42, 0.06);
        }

        .liquid-btn-active {
            background: rgba(15, 23, 42, 0.78) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.4),
                        0 4px 12px rgba(15, 23, 42, 0.2) !important;
        }

        .liquid-btn-inactive {
            background: rgba(255, 255, 255, 0.38) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            color: #475569 !important;
            border: 1px solid rgba(255, 255, 255, 0.65) !important;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.85) !important;
        }
        .liquid-btn-inactive:hover {
            background: rgba(255, 255, 255, 0.55) !important;
            color: #1e293b !important;
        }

        .liquid-input {
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.75) !important;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04),
                        0 1px 2px rgba(255, 255, 255, 0.8) !important;
        }
        .liquid-input:focus {
            background: rgba(255, 255, 255, 0.68) !important;
            border-color: rgba(15, 23, 42, 0.6) !important;
        }

        .workspace-area {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            overflow: hidden;
        }

        .planner-sheet {
            width: 100%;
            max-width: 1380px;
            height: 100%;
            max-height: 920px;
            background-color: var(--paper-bg);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 16px 44px -10px rgba(15, 23, 42, 0.1),
                        inset 0 1px 2px rgba(255, 255, 255, 0.9);
            padding: 8px 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .planner-master-grid {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 72% 28%;
            grid-template-rows: repeat(24, minmax(0, 1fr));
            border-top: 1.2px solid var(--line-strong);
            border-bottom: 1.2px solid var(--line-strong);
        }

        .b-bottom-light { border-bottom: 1px solid var(--line-light); }
        .b-bottom-cat { border-bottom: 1.1px solid var(--line-cat); }
        .b-bottom-strong { border-bottom: 1.2px solid var(--line-strong); }
        .b-right-strong { border-right: 1px solid var(--line-strong); }

        .field-label {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--ink-muted);
            line-height: 1;
            text-transform: uppercase;
            user-select: none;
        }

        .planner-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--ink-primary);
            font-family: inherit;
            padding: 0;
            margin: 0;
        }
        .planner-input::placeholder {
            color: #c4c4cc;
            font-weight: 400;
        }

        .task-checkbox {
            width: 15px;
            height: 15px;
            border: 1.5px solid #1e293b;
            border-radius: 2.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-color: transparent;
            color: #111111;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            position: relative;
            z-index: 2;
        }
        .task-checkbox:hover {
            border-color: #000000;
        }

        .shade-pill,
        .shade-highlight {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding-left: 14px;
            padding-right: 14px;
            height: 20px;
            border-radius: 0px;
            max-width: calc(100% - 4px);
            transition: background-color 0.15s ease;
            position: relative;
        }

        .liquid-glass-picker {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(44px) saturate(230%) brightness(1.05);
            -webkit-backdrop-filter: blur(44px) saturate(230%) brightness(1.05);
            border: 1px solid rgba(255, 255, 255, 0.92);
            box-shadow: 0 24px 60px -10px rgba(15, 23, 42, 0.35),
                        0 0 0 1px rgba(15, 23, 42, 0.06),
                        inset 0 1.5px 2px rgba(255, 255, 255, 0.98);
        }

        .sv-spectrum-box {
            position: relative;
            width: 100%;
            height: 132px;
            border-radius: 12px;
            overflow: hidden;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
        }
        .sv-spectrum-white {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #ffffff 0%, rgba(255, 255, 255, 0) 100%);
        }
        .sv-spectrum-black {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000000 100%);
        }
        .sv-spectrum-thumb {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            border: 2.5px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.38), inset 0 0 0 1px rgba(0, 0, 0, 0.15);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hue-slider-track {
            position: relative;
            width: 100%;
            height: 14px;
            border-radius: 9999px;
            background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
            cursor: pointer;
            touch-action: none;
            user-select: none;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18);
        }
        .hue-slider-thumb {
            position: absolute;
            top: 50%;
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            background: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .no-color-slash {
            position: relative;
            background-color: rgba(255, 255, 255, 0.85);
            overflow: hidden;
        }
        .no-color-slash::after {
            content: "";
            position: absolute;
            top: 50%;
            left: -20%;
            width: 140%;
            height: 1.8px;
            background-color: #ef4444;
            transform: translateY(-50%) rotate(-45deg);
            pointer-events: none;
        }

        .tt-slot {
            border-right: 1px dashed rgba(161, 161, 170, 0.28);
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
            transition: background-color 0.06s ease;
        }
        .tt-slot:nth-child(3) {
            border-right: 1px dotted rgba(161, 161, 170, 0.55);
        }
        .tt-slot:last-child {
            border-right: none;
        }
        .tt-slot-selecting {
            background-color: rgba(59, 130, 246, 0.28) !important;
            box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.65);
        }
        .tt-slot-drop-preview {
            background-color: rgba(16, 185, 129, 0.28) !important;
            box-shadow: inset 0 0 0 1px rgba(5, 150, 105, 0.7);
        }
        .tt-slot-occupied {
            cursor: pointer;
        }
        .todo-draggable-row[draggable="true"] {
            cursor: grab;
        }
        .todo-draggable-row[draggable="true"]:active {
            cursor: grabbing;
        }

        .touch-drag-ghost {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -135%);
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px) saturate(190%);
            -webkit-backdrop-filter: blur(16px) saturate(190%);
            border: 1px solid rgba(15, 23, 42, 0.18);
            box-shadow: 0 14px 32px -6px rgba(15, 23, 42, 0.25);
            font-size: 12px;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes deepLinkPulse {
            0%, 100% { background-color: transparent; }
            30%, 70% { background-color: rgba(251, 191, 36, 0.35); }
        }
        .deeplink-flash {
            animation: deepLinkPulse 1.6s ease-in-out;
        }

        /* Portrait Mode */
        html.layout-portrait,
        html.layout-portrait body {
            height: auto !important;
            min-height: 100dvh !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        html.layout-portrait .app-viewport {
            height: auto !important;
            min-height: 100dvh !important;
            overflow: visible !important;
            display: block !important;
        }
        html.layout-portrait .workspace-area {
            height: auto !important;
            min-height: 100dvh !important;
            overflow: visible !important;
            display: block !important;
            padding: 10px 10px 36px 10px !important;
        }
        html.layout-portrait .planner-sheet {
            max-width: 560px;
            width: 100%;
            height: auto !important;
            max-height: none !important;
            margin: 0 auto;
            padding: 10px 12px 14px 12px;
            overflow: visible !important;
        }
        html.layout-portrait .planner-master-grid {
            display: flex !important;
            flex-direction: column !important;
            flex: none !important;
            height: auto !important;
            overflow: visible !important;
        }
        html.layout-portrait .top-date-goal-row {
            flex-direction: column !important;
            border-right: none !important;
        }
        html.layout-portrait .top-date-cell {
            width: 100% !important;
            border-right: none !important;
            border-bottom: 1px solid var(--line-light);
            min-height: 54px;
            padding-bottom: 6px;
        }
        html.layout-portrait .top-goal-cell {
            width: 100% !important;
            min-height: 54px;
            padding-bottom: 6px;
        }
        html.layout-portrait #middleRowsContainer {
            grid-template-rows: repeat(18, 38px) !important;
            height: auto !important;
            flex: none !important;
            border-right: none !important;
        }
        @media (max-width: 520px) {
            html.layout-portrait #middleRowsContainer {
                grid-template-columns: 1fr !important;
                grid-template-rows: auto !important;
                grid-auto-flow: row !important;
                grid-auto-rows: 38px !important;
            }
            html.layout-portrait #middleRowsContainer > div {
                border-right: none !important;
            }
        }
        html.layout-portrait .portrait-review-row {
            min-height: 38px !important;
            height: 38px !important;
            flex: none !important;
            border-right: none !important;
        }
        html.layout-portrait #timetableColumnContainer {
            grid-template-rows: repeat(24, 36px) !important;
            height: auto !important;
            flex: none !important;
            border-top: 1.2px solid var(--line-strong);
        }
        html.layout-portrait .tt-slot {
            touch-action: pan-y !important;
        }
        html.layout-portrait .portrait-row-h {
            min-height: 36px;
        }

        @media print {
            @page { size: 297mm 210mm; margin: 0; }
            html, body { background: #fff !important; overflow: hidden !important; }
            .no-print { display: none !important; }
            .workspace-area { padding: 0 !important; }
            .planner-sheet {
                width: 297mm !important;
                height: 210mm !important;
                max-width: none !important;
                max-height: none !important;
                border: none !important;
                box-shadow: none !important;
                padding: 10mm 16mm 8mm 16mm !important;
            }
        }
    </style>
</head>
<body>
    <div class="app-viewport">
        <main class="workspace-area">
            <section class="planner-sheet" aria-label="Landscape Daily Planner">
                <div class="planner-master-grid">

                    <div style="grid-column: 1; grid-row: 1 / span 2;" class="top-date-goal-row b-right-strong b-bottom-strong flex min-h-[52px]">
                        <div onclick="openDatePickerModal()" class="top-date-cell w-[27%] min-w-[190px] b-right-strong px-3 pt-1.5 pb-1 flex flex-col overflow-hidden cursor-pointer hover:bg-zinc-50/60 transition-colors" title="CLICK TO SELECT DATE">
                            <div class="flex items-center justify-between flex-shrink-0">
                                <span class="field-label">DATE</span>
                            </div>
                            <div class="flex-1 flex items-center">
                                <div class="group flex items-baseline whitespace-nowrap flex-nowrap text-slate-700 py-0.5 select-none">
                                    <span id="dateYYYY" class="inline-block min-w-[4.2ch] text-center text-[13.5px] font-semibold tracking-tight uppercase"></span>
                                    <span class="font-bold text-slate-400 px-1 select-none">.</span>
                                    <span id="dateMM" class="inline-block min-w-[2.2ch] text-center text-[13.5px] font-semibold tracking-tight uppercase"></span>
                                    <span class="font-bold text-slate-400 px-1 select-none">.</span>
                                    <span id="dateDD" class="inline-block min-w-[2.2ch] text-center text-[13.5px] font-semibold tracking-tight uppercase"></span>
                                    <span class="inline-flex items-baseline ml-1.5 text-slate-400 text-[13px] flex-shrink-0">
                                        <span class="select-none">(</span>
                                        <span id="dateDOW" class="mx-1 text-center text-[12px] font-semibold text-slate-700 uppercase"></span>
                                        <span class="select-none">)</span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="top-goal-cell w-[73%] px-3.5 pt-1.5 pb-1 flex flex-col overflow-hidden">
                            <div class="flex items-center justify-between gap-2 flex-shrink-0">
                                <span class="field-label">GOAL</span>
                                <div class="no-print flex items-center gap-2">
                                    <span id="twoTapIndicator" class="hidden items-center gap-1 text-[9.5px] font-semibold text-blue-700 bg-blue-50/90 px-2 py-0.5 rounded-full border border-blue-200">
                                        <span id="twoTapText">SELECT END</span>
                                        <button type="button" onclick="cancelTwoTapSelection()" class="ml-1">✕</button>
                                    </span>
                                </div>
                            </div>
                            <div class="flex-1 flex items-center w-full">
                                <input id="goalInput" type="text" placeholder=""
                                    class="planner-input w-full text-[13.5px] font-medium text-slate-800"
                                    oninput="handleGoalChange(this.value)">
                            </div>
                        </div>
                    </div>

                    <div id="middleRowsContainer" style="grid-column: 1; grid-row: 3 / span 18;" class="b-right-strong grid grid-cols-2 grid-rows-[repeat(18,minmax(0,1fr))] grid-flow-col min-h-0">
                    </div>

                    <div style="grid-column: 1; grid-row: 21;" class="portrait-review-row portrait-row-h b-right-strong b-bottom-light px-3 flex items-center">
                        <span class="field-label">DAILY REVIEW</span>
                    </div>

                    <div style="grid-column: 1; grid-row: 22;" class="portrait-review-row portrait-row-h b-right-strong b-bottom-light px-3.5 flex items-center">
                        <div class="inline-flex items-center text-[12px] font-normal text-[#475569] select-none flex-shrink-0 mr-2.5">
                            <span class="inline-flex items-center w-[82px] tracking-[0.03em]">
                                <span class="text-[#64748b] mr-1.5">•</span>KEEP
                            </span>
                            <span class="text-[#475569]">:</span>
                        </div>
                        <input id="reviewKeep" type="text"
                            class="planner-input flex-1 text-[13px] text-slate-800"
                            oninput="handleReviewChange('keep', this.value)">
                    </div>

                    <div style="grid-column: 1; grid-row: 23;" class="portrait-review-row portrait-row-h b-right-strong b-bottom-light px-3.5 flex items-center">
                        <div class="inline-flex items-center text-[12px] font-normal text-[#475569] select-none flex-shrink-0 mr-2.5">
                            <span class="inline-flex items-center w-[82px] tracking-[0.03em]">
                                <span class="text-[#64748b] mr-1.5">•</span>PROBLEM
                            </span>
                            <span class="text-[#475569]">:</span>
                        </div>
                        <input id="reviewProblem" type="text"
                            class="planner-input flex-1 text-[13px] text-slate-800"
                            oninput="handleReviewChange('problem', this.value)">

        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTodayDateKey() { return formatDateKey(new Date()); }

        function parseDateKeyToParts(dateKey) {
            const [y, m, d] = (dateKey || getTodayDateKey()).split('-').map(Number);
            const dt = new Date(y, (m || 1) - 1, d || 1);
            return {
                yyyy: String(dt.getFullYear()),
                mm: String(dt.getMonth() + 1).padStart(2, '0'),
                dd: String(dt.getDate()).padStart(2, '0'),
                dow: DOW_NAMES[dt.getDay()],
                dateObj: dt
            };
        }

        let selectedDateKey = getTodayDateKey();
        let calendarViewYear = new Date().getFullYear();
        let calendarViewMonth = new Date().getMonth();

        function normalizeColorHex(colorVal) {
            if (!colorVal || colorVal === 'none') return 'none';
            if (LEGACY_COLOR_MAP[colorVal]) return LEGACY_COLOR_MAP[colorVal];
            return colorVal;
        }

        function hexToRgba(hex, alpha = 0.42) {
            const normalized = normalizeColorHex(hex);
            if (!normalized || normalized === 'none') return 'transparent';
            let c = normalized.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            if (isNaN(num)) return `rgba(147, 213, 246, ${alpha})`;
            const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function applyNaturalShadeStyle(element, hex) {
            const normalized = normalizeColorHex(hex);
            if (!normalized || normalized === 'none') {
                element.style.backgroundColor = 'transparent';
                element.style.boxShadow = 'none';
                element.style.border = 'none';
                return;
            }
            element.style.backgroundColor = hexToRgba(normalized, 0.42);
            element.style.boxShadow = 'none';
            element.style.border = 'none';
        }

        async function savePinnedColors() {
            if (!currentUser || !db) return;
            try {
                const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'planner_settings', `${syncWorkspaceKey}_config`);
                await setDoc(settingsDocRef, { syncKey: syncWorkspaceKey, pinnedColorsJson: JSON.stringify(pinnedColors), updatedAt: Date.now(), updatedBy: currentUser.uid });
            } catch (err) {}
        }

        function switchSelectedDate(newDateKey) {
            if (!newDateKey) newDateKey = getTodayDateKey();
            selectedDateKey = newDateKey;
            const parts = parseDateKeyToParts(selectedDateKey);

        function changeCalendarMonth(delta) {
            calendarViewMonth += delta;
            if (calendarViewMonth < 0) { calendarViewMonth = 11; calendarViewYear--; }
            else if (calendarViewMonth > 11) { calendarViewMonth = 0; calendarViewYear++; }

        }

            plannerState = getBlankPlannerData(selectedDateKey);

        function renderCalendarGrid() {
            const labelEl = document.getElementById('calendarMonthLabel');
            const gridEl = document.getElementById('calendarDaysGrid');
            if (!labelEl || !gridEl) return;
            labelEl.textContent = `${MONTH_NAMES[calendarViewMonth]} ${calendarViewYear}`;
            gridEl.innerHTML = '';
            const firstDayOfMonth = new Date(calendarViewYear, calendarViewMonth, 1).getDay();
            const daysInMonth = new Date(calendarViewYear, calendarViewMonth + 1, 0).getDate();
            const todayKey = getTodayDateKey();

            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-9';
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dt = new Date(calendarViewYear, calendarViewMonth, day);
                const dKey = formatDateKey(dt);
                const isSelected = dKey === selectedDateKey;
                const isToday = dKey === todayKey;
                const hasData = isDateEntryNonEmpty(allPlannersByDate[dKey]);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => selectDateFromPicker(dKey);
                let baseCls = 'relative h-9 rounded-xl flex flex-col items-center justify-center text-[12px] font-semibold transition ';
                if (isSelected) baseCls += 'liquid-btn-active text-white font-bold';
                else if (isToday) baseCls += 'bg-white/75 text-slate-900 border border-slate-400 font-bold hover:bg-white';
                else baseCls += 'text-slate-700 hover:bg-white/60';
                btn.className = baseCls;

                const numSpan = document.createElement('span');
                numSpan.className = 'leading-none';
                numSpan.textContent = day;
                btn.appendChild(numSpan);

                if (hasData) {
                    const dot = document.createElement('span');
                    dot.className = `w-1 h-1 rounded-full mt-0.5 ${isSelected ? 'bg-white' : 'bg-slate-800'}`;
                    btn.appendChild(dot);
                }
                gridEl.appendChild(btn);
            }
        }

        let pickerHue = 200, pickerSat = 40, pickerVal = 96;
        function hexToHsv(hex) {
            let c = normalizeColorHex(hex);
            if (!c || c === 'none') c = '#93D5F6';
            c = c.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            if (isNaN(num)) return { h: 200, s: 40, v: 96 };
            const r = ((num >> 16) & 255) / 255, g = ((num >> 8) & 255) / 255, b = (num & 255) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            let h = 0; const s = max === 0 ? 0 : d / max, v = max;
            if (max !== min) {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
        }

        function hsvToHex(h, s, v) {
            const sNorm = s / 100, vNorm = v / 100, c = vNorm * sNorm, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = vNorm - c;
            let r = 0, g = 0, b = 0;
            if (h >= 0 && h < 60) { r = c; g = x; b = 0; }
            else if (h >= 60 && h < 120) { r = x; g = c; b = 0; }
            else if (h >= 120 && h < 180) { r = 0; g = c; b = x; }
            else if (h >= 180 && h < 240) { r = 0; g = x; b = c; }
            else if (h >= 240 && h < 300) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }
            const toHex = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
        }

        function closeSpectrumPicker() { document.getElementById('spectrumPickerOverlay')?.classList.add('hidden'); activePickerTarget = null; }
        function handlePickerHexTyping(val) {
            const clean = val.trim();

                const hsv = hexToHsv(clean);

        function initSpectrumPickerEvents() {
            const svBox = document.getElementById('svSpectrumBox'), hueTrack = document.getElementById('hueSliderTrack');
            svBox?.addEventListener('pointerdown', (e) => { e.stopPropagation(); svBox.setPointerCapture(e.pointerId); updateSVFromEvent(e, svBox); });

            hueTrack?.addEventListener('pointerdown', (e) => { e.stopPropagation(); hueTrack.setPointerCapture(e.pointerId); updateHueFromEvent(e, hueTrack); });

        function updateSVFromEvent(e, box) {

            pickerSat = Math.max(0, Math.min(100, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
            pickerVal = Math.max(0, Math.min(100, Math.round(100 - ((e.clientY - rect.top) / rect.height) * 100)));

        }
        function updateHueFromEvent(e, track) {
            const rect = track.getBoundingClientRect();

            updateSpectrumPickerUI(); handleNativePickerValueChange(hsvToHex(pickerHue, pickerSat, pickerVal));
        }

        function handleNativePickerValueChange(hexVal) {

        function getBlankPlannerData(dateKey = selectedDateKey) {
            const parts = parseDateKeyToParts(dateKey);
            const makeEmptyCol = () => Array.from({ length: MIDDLE_ROW_COUNT }, (_, idx) => ({ rowType: (idx === 0 || idx === 9) ? 'topic' : 'task', text: '', done: false, hl: 'none' }));
            return { date: parts, goal: '', columns: { left: makeEmptyCol(), right: makeEmptyCol() }, review: { keep: '', problem: '', try: '' }, timeBlocks: [] };
        }

        function normalizeColumnLength(colArr) {
            if (!Array.isArray(colArr) || colArr.length !== MIDDLE_ROW_COUNT) {
                return Array.from({ length: MIDDLE_ROW_COUNT }, (_, idx) => ({ rowType: (idx === 0 || idx === 9) ? 'topic' : 'task', text: '', done: false, hl: 'none' }));
            }
            return colArr;
        }

        let allPlannersByDate = {};
        function getPlannerDataForDate(dateKey) {
            const parts = parseDateKeyToParts(dateKey);
            const existing = allPlannersByDate[dateKey];
            if (existing && existing.columns) {
                existing.columns.left = normalizeColumnLength(existing.columns.left);
                existing.columns.right = normalizeColumnLength(existing.columns.right);
                existing.date = parts;
                if (!existing.review) existing.review = { keep: '', problem: '', try: '' };
                if (!Array.isArray(existing.timeBlocks)) existing.timeBlocks = [];
                return existing;
            }
            return getBlankPlannerData(dateKey);
        }

        function isDateEntryNonEmpty(entry) {
            if (!entry) return false;
            if (entry.goal?.trim() || entry.review?.keep?.trim() || entry.review?.problem?.trim() || entry.review?.try?.trim() || entry.timeBlocks?.length > 0) return true;
            return entry.columns?.left?.some(r => r.text?.trim()) || entry.columns?.right?.some(r => r.text?.trim());
        }

        let plannerState = getPlannerDataForDate(selectedDateKey);

        async function pushDateStateToCloud(dateKeyToSave, stateObj) {
            if (!currentUser || !db) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'planner_days', `${syncWorkspaceKey}_${dateKeyToSave}`);
            try {
                if (isDateEntryNonEmpty(stateObj)) await setDoc(docRef, { syncKey: syncWorkspaceKey, dateKey: dateKeyToSave, payloadJson: JSON.stringify(stateObj), updatedAt: Date.now(), updatedBy: currentUser.uid });
                else await deleteDoc(docRef);
            } catch (err) {}
        }

        function saveStateToStorage(debounced = false) {
            if (isDateEntryNonEmpty(plannerState)) allPlannersByDate[selectedDateKey] = JSON.parse(JSON.stringify(plannerState));
            else delete allPlannersByDate[selectedDateKey];
            clearTimeout(saveDebounceTimer);
            if (debounced) saveDebounceTimer = setTimeout(() => pushDateStateToCloud(selectedDateKey, plannerState), 350);
            else pushDateStateToCloud(selectedDateKey, plannerState);

                auth = getAuth(firebaseApp);

        function handleGoalChange(val) { plannerState.goal = val; saveStateToStorage(true); }
        function handleReviewChange(key, val) { plannerState.review[key] = val; saveStateToStorage(true); }

        function slotToTimeStr(slotIndex, isEnd = false) {
            const mins = (isEnd ? slotIndex + 1 : slotIndex) * 10;
            return `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
        }

        function getBlockAtSlot(slotIndex, ignoreBlockId = null) {
            return plannerState.timeBlocks.find(b => !ignoreBlockId || b.id !== ignoreBlockId ? (slotIndex >= b.startSlot && slotIndex <= b.endSlot) : false);
        }
        function isSlotOccupied(slotIndex, ignoreBlockId = null) { return !!getBlockAtSlot(slotIndex, ignoreBlockId); }
        function isRangeOverlapping(startS, endS, ignoreBlockId = null) {
            const minS = Math.min(startS, endS), maxS = Math.max(startS, endS);
            return plannerState.timeBlocks.some(b => (!ignoreBlockId || b.id !== ignoreBlockId) && !(b.endSlot < minS || b.startSlot > maxS));
        }
        function clampSlotRangeToEmpty(anchorSlot, targetSlot, ignoreBlockId = null) {
            const clamped = Math.max(0, Math.min(TOTAL_SLOTS - 1, targetSlot));
            if (isSlotOccupied(anchorSlot, ignoreBlockId)) return anchorSlot;
            const step = clamped >= anchorSlot ? 1 : -1;
            let lastValid = anchorSlot;
            for (let s = anchorSlot + step; step > 0 ? s <= clamped : s >= clamped; s += step) {
                if (isSlotOccupied(s, ignoreBlockId)) break;
                lastValid = s;
            }
            return lastValid;
        }

        function findFirstAvailableSlot(preferredSlot = 54, ignoreBlockId = null) {
            if (!isSlotOccupied(preferredSlot, ignoreBlockId)) return preferredSlot;
            for (let s = preferredSlot; s < TOTAL_SLOTS; s++) {
                if (!isSlotOccupied(s, ignoreBlockId)) return s;
            }
            for (let s = 0; s < preferredSlot; s++) {
                if (!isSlotOccupied(s, ignoreBlockId)) return s;
            }
            return 0;
        }

        function findLinkedTimeBlockForTask(colKey, rowIdx, taskText = '') {
            const taskKey = `${colKey}-${rowIdx}`;
            const byKey = plannerState.timeBlocks.find(b => b.linkedTaskKey === taskKey);
            if (byKey) return byKey;
            const cleanTxt = (taskText || '').trim();
            if (!cleanTxt) return null;
            return plannerState.timeBlocks.find(b => !b.linkedTaskKey && (b.text || '').trim() === cleanTxt) || null;
        }

        function updateTodoDropPreview(startSlot) {
            clearTodoDropPreview();
            if (startSlot === null || startSlot === undefined || isSlotOccupied(startSlot)) return;
            const endSlot = clampSlotRangeToEmpty(startSlot, Math.min(TOTAL_SLOTS - 1, startSlot + 5));
            dropPreviewSlots = [startSlot, endSlot];
            document.querySelectorAll('.tt-slot').forEach(el => {
                const s = Number(el.dataset.slot);
                if (s >= startSlot && s <= endSlot) el.classList.add('tt-slot-drop-preview');
            });
        }

        function clearTodoDropPreview() {
            dropPreviewSlots = [];
            document.querySelectorAll('.tt-slot-drop-preview').forEach(el => el.classList.remove('tt-slot-drop-preview'));
        }

        function renderTimetable() {
            const container = document.getElementById('timetableColumnContainer');
            container.innerHTML = '';
            HOURS.forEach((hour, rowIdx) => {
                let borderBottom = (hour === 1 || hour === 10 || hour === 19) ? 'b-bottom-strong' : (hour === 23 ? '' : 'b-bottom-light');
                const rowEl = document.createElement('div');
                rowEl.className = `portrait-row-h ${borderBottom} flex items-stretch relative min-h-0 overflow-hidden`;
                const hourCol = document.createElement('div');
                hourCol.className = 'w-6 flex-shrink-0 flex items-center pl-1.5 text-[11px] font-medium text-[#71717a] select-none';
                hourCol.textContent = hour;
                rowEl.appendChild(hourCol);

                const slotsWrap = document.createElement('div');
                slotsWrap.className = 'flex-1 grid grid-cols-6 relative min-w-0';
                for (let s = 0; s < 6; s++) {
                    const globalSlot = rowIdx * 6 + s;
                    const block = getBlockAtSlot(globalSlot);
                    const slotEl = document.createElement('div');
                    slotEl.dataset.slot = globalSlot;
                    slotEl.className = `tt-slot relative h-full cursor-pointer hover:bg-black/[0.03] ${block ? 'tt-slot-occupied' : ''}`;
                    if (block && block.color && block.color !== 'none') {
                        slotEl.style.backgroundColor = hexToRgba(block.color, 0.42);
                    }

                    if (isDraggingTimetable && dragStartSlot !== null && dragCurrentSlot !== null) {
                        const minS = Math.min(dragStartSlot, dragCurrentSlot);
                        const maxS = Math.max(dragStartSlot, dragCurrentSlot);
                        if (globalSlot >= minS && globalSlot <= maxS) slotEl.classList.add('tt-slot-selecting');
                    } else if (twoTapStartSlot === globalSlot) {
                        slotEl.classList.add('tt-slot-selecting');
                    }

                    slotEl.addEventListener('pointerdown', (e) => handleSlotPointerDown(e, globalSlot));
                    slotEl.addEventListener('pointerenter', (e) => handleSlotPointerEnter(e, globalSlot));

                    slotEl.addEventListener('dragover', (e) => {
                        if (!draggedTodoData) return;
                        if (isSlotOccupied(globalSlot)) {
                            if (e.dataTransfer) e.dataTransfer.dropEffect = 'none';
                            clearTodoDropPreview();
                            return;
                        }
                        e.preventDefault();
                        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
                        updateTodoDropPreview(globalSlot);
                    });

                    slotEl.addEventListener('drop', (e) => {
                        if (!draggedTodoData) return;
                        e.preventDefault();
                        const todoPayload = { ...draggedTodoData };
                        draggedTodoData = null;
                        clearTodoDropPreview();
                        if (isSlotOccupied(globalSlot)) return;

                        cancelTwoTapSelection();
                        const startSlot = globalSlot;
                        const endSlot = clampSlotRangeToEmpty(startSlot, Math.min(TOTAL_SLOTS - 1, startSlot + 5));
                        const dropColor = (todoPayload.hl && todoPayload.hl !== 'none') ? todoPayload.hl : (pinnedColors[0] || '#93D5F6');
                        openTimeBlockModalForRange(startSlot, endSlot, todoPayload.text, dropColor, todoPayload.taskKey || null);
                    });

                    slotsWrap.appendChild(slotEl);
                }

                plannerState.timeBlocks.forEach(block => {
                    const rStart = rowIdx * 6, rEnd = rStart + 5;
                    if (block.endSlot < rStart || block.startSlot > rEnd || block.startSlot < rStart || block.startSlot > rEnd || !block.text) return;
                    const lPct = ((Math.max(0, block.startSlot - rStart)) / 6) * 100;
                    const wPct = (((Math.min(5, block.endSlot - rStart) - Math.max(0, block.startSlot - rStart) + 1)) / 6) * 100;
                    const overlay = document.createElement('div');
                    overlay.style.left = `${lPct}%`; overlay.style.width = `${wPct}%`;
                    overlay.className = 'absolute inset-y-0 z-10 flex items-center px-1.5 pointer-events-none overflow-hidden';
                    const span = document.createElement('span');
                    span.className = 'text-[11.5px] font-medium text-slate-800 whitespace-nowrap overflow-visible';
                    span.textContent = block.text;
                    overlay.appendChild(span);
                    slotsWrap.appendChild(overlay);
                });

                rowEl.appendChild(slotsWrap);
                container.appendChild(rowEl);
            });
        }

        let pointerMovedDuringDrag = false;
        let pointerDownOccupiedBlockId = null;
        let touchSlotCandidate = null;
        let touchStartClientX = 0;
        let touchStartClientY = 0;
        let touchWasScrolled = false;
        let touchHoldDragTimer = null;
        let isTouchRangeDragging = false;

        function setTwoTapStartSlotUI(slotIndex) {
            twoTapStartSlot = slotIndex;
            const timeLabel = slotToTimeStr(slotIndex);
            const indicator = document.getElementById('twoTapIndicator');
            const textEl = document.getElementById('twoTapText');

                floatingBanner.classList.remove('hidden');

        function cancelTwoTapSelection() {
            twoTapStartSlot = null;
            const indicator = document.getElementById('twoTapIndicator');
            if (indicator) {
                indicator.classList.add('hidden');
                indicator.classList.remove('inline-flex');
            }
            const floatingBanner = document.getElementById('floatingTwoTapBanner');

                floatingBanner.classList.add('hidden');
                floatingBanner.classList.remove('inline-flex');
            }
            renderTimetable();
        }

        function handleSlotPointerDown(e, slotIndex) {
            if (e.button !== undefined && e.button !== 0) return;

            if (e.pointerType === 'touch') {
                clearTimeout(touchHoldDragTimer);
                touchSlotCandidate = slotIndex;
                touchStartClientX = e.clientX;
                touchStartClientY = e.clientY;
                touchWasScrolled = false;
                isTouchRangeDragging = false;
                isDraggingTimetable = false;
                pointerDownOccupiedBlockId = null;

                if (!isSlotOccupied(slotIndex) && twoTapStartSlot === null) {
                    touchHoldDragTimer = setTimeout(() => {
                        if (!touchWasScrolled && touchSlotCandidate === slotIndex) {
                            isTouchRangeDragging = true;
                            isDraggingTimetable = true;
                            dragStartSlot = slotIndex;
                            dragCurrentSlot = slotIndex;
                            updateDragVisuals();
                        }
                    }, 220);
                }
                return;
            }

            pointerMovedDuringDrag = false;
            pointerDownOccupiedBlockId = null;

            const existingBlock = getBlockAtSlot(slotIndex);
            if (existingBlock && twoTapStartSlot === null) {
                pointerDownOccupiedBlockId = existingBlock.id;
                isDraggingTimetable = false;
                return;
            }

            if (existingBlock && twoTapStartSlot !== null) {
                const clampedEnd = clampSlotRangeToEmpty(twoTapStartSlot, slotIndex);
                const rangeStart = Math.min(twoTapStartSlot, clampedEnd);
                const rangeEnd = Math.max(twoTapStartSlot, clampedEnd);
                cancelTwoTapSelection();
                openTimeBlockModalForRange(rangeStart, rangeEnd);
                return;
            }

            isDraggingTimetable = true;
            dragStartSlot = slotIndex;
            dragCurrentSlot = slotIndex;
            updateDragVisuals();
        }

        function handleSlotPointerEnter(e, slotIndex) {
            if (e.pointerType === 'touch') return;
            if (!isDraggingTimetable || dragStartSlot === null) return;
            const clampedSlot = clampSlotRangeToEmpty(dragStartSlot, slotIndex);
            if (slotIndex !== dragStartSlot) pointerMovedDuringDrag = true;
            if (clampedSlot !== dragCurrentSlot) {
                dragCurrentSlot = clampedSlot;
                updateDragVisuals();
            }
        }

        window.addEventListener('pointermove', (e) => {
            if (e.pointerType === 'touch') {
                if (isTouchRangeDragging && isDraggingTimetable && dragStartSlot !== null) {
                    if (e.cancelable) e.preventDefault();
                    const el = document.elementFromPoint(e.clientX, e.clientY);
                    const slotEl = el ? el.closest('[data-slot]') : null;
                    if (slotEl && slotEl.dataset.slot !== undefined) {
                        const slotIdx = Number(slotEl.dataset.slot);
                        const clampedSlot = clampSlotRangeToEmpty(dragStartSlot, slotIdx);
                        if (clampedSlot !== dragCurrentSlot) {
                            dragCurrentSlot = clampedSlot;
                            updateDragVisuals();
                        }
                    }
                    return;
                }

                if (touchSlotCandidate !== null) {
                    const dx = Math.abs(e.clientX - touchStartClientX);
                    const dy = Math.abs(e.clientY - touchStartClientY);
                    if (dx > 12 || dy > 12) {
                        clearTimeout(touchHoldDragTimer);
                        touchWasScrolled = true;
                        touchSlotCandidate = null;
                    }
                }
                return;
            }

            if (!isDraggingTimetable || dragStartSlot === null) return;
            const el = document.elementFromPoint(e.clientX, e.clientY);
            if (el && el.dataset && el.dataset.slot !== undefined) {
                const slotIdx = Number(el.dataset.slot);
                const clampedSlot = clampSlotRangeToEmpty(dragStartSlot, slotIdx);
                if (slotIdx !== dragStartSlot) pointerMovedDuringDrag = true;
                if (clampedSlot !== dragCurrentSlot) {
                    dragCurrentSlot = clampedSlot;
                    updateDragVisuals();
                }
            }
        }, { passive: false });

        window.addEventListener('pointercancel', () => {
            clearTimeout(touchHoldDragTimer);
            touchSlotCandidate = null;
            touchWasScrolled = true;
            isTouchRangeDragging = false;
            isDraggingTimetable = false;
        });

        window.addEventListener('scroll', () => {
            if (!isTouchRangeDragging && touchSlotCandidate !== null) {
                clearTimeout(touchHoldDragTimer);
                touchWasScrolled = true;
                touchSlotCandidate = null;
            }
        }, { passive: true });

        window.addEventListener('pointerup', (e) => {
            clearTimeout(touchHoldDragTimer);

            if (e && e.pointerType === 'touch') {
                if (isTouchRangeDragging && isDraggingTimetable && dragStartSlot !== null) {
                    isTouchRangeDragging = false;
                    isDraggingTimetable = false;
                    const startS = Math.min(dragStartSlot, dragCurrentSlot);
                    const endS = Math.max(dragStartSlot, dragCurrentSlot);
                    dragStartSlot = null;
                    dragCurrentSlot = null;
                    touchSlotCandidate = null;
                    cancelTwoTapSelection();
                    openTimeBlockModalForRange(startS, endS);
                    return;
                }

                if (touchWasScrolled || touchSlotCandidate === null) {
                    touchSlotCandidate = null;
                    touchWasScrolled = false;
                    return;
                }
                const tappedSlot = touchSlotCandidate;
                touchSlotCandidate = null;
                touchWasScrolled = false;

                const existingBlock = getBlockAtSlot(tappedSlot);
                if (twoTapStartSlot !== null) {
                    const clampedEnd = clampSlotRangeToEmpty(twoTapStartSlot, tappedSlot);
                    const rangeStart = Math.min(twoTapStartSlot, clampedEnd);
                    const rangeEnd = Math.max(twoTapStartSlot, clampedEnd);
                    cancelTwoTapSelection();
                    openTimeBlockModalForRange(rangeStart, rangeEnd);
                } else if (existingBlock) {
                    openTimeBlockModalForExisting(existingBlock.id);
                } else {
                    setTwoTapStartSlotUI(tappedSlot);
                }
                return;
            }

            if (pointerDownOccupiedBlockId) {
                const blockId = pointerDownOccupiedBlockId;
                pointerDownOccupiedBlockId = null;
                openTimeBlockModalForExisting(blockId);
                return;
            }

            if (!isDraggingTimetable) return;
            isDraggingTimetable = false;

            const startS = Math.min(dragStartSlot, dragCurrentSlot);
            const endS = Math.max(dragStartSlot, dragCurrentSlot);

            if (pointerMovedDuringDrag && startS !== endS) {
                cancelTwoTapSelection();
                openTimeBlockModalForRange(startS, endS);
            } else {
                const clickedSlot = dragStartSlot;
                const existingBlock = getBlockAtSlot(clickedSlot);

                if (twoTapStartSlot !== null) {
                    const clampedEnd = clampSlotRangeToEmpty(twoTapStartSlot, clickedSlot);
                    const rangeStart = Math.min(twoTapStartSlot, clampedEnd);
                    const rangeEnd = Math.max(twoTapStartSlot, clampedEnd);
                    cancelTwoTapSelection();
                    openTimeBlockModalForRange(rangeStart, rangeEnd);
                } else if (existingBlock) {
                    openTimeBlockModalForExisting(existingBlock.id);
                } else {
                    setTwoTapStartSlotUI(clickedSlot);
                }
            }

            dragStartSlot = null;
            dragCurrentSlot = null;
        });

        function updateDragVisuals() {
            const minS = Math.min(dragStartSlot, dragCurrentSlot);
            const maxS = Math.max(dragStartSlot, dragCurrentSlot);
            document.querySelectorAll('.tt-slot').forEach(el => {
                const s = Number(el.dataset.slot);
                if (s >= minS && s <= maxS) el.classList.add('tt-slot-selecting');
                else el.classList.remove('tt-slot-selecting');
            });
        }

        function populateModalTaskTimeSelects() {
            const startSel = document.getElementById('modalTaskStartSlotSelect');
            const endSel = document.getElementById('modalTaskEndSlotSelect');
            if (!startSel || !endSel) return;

            startSel.innerHTML = '';
            for (let s = 0; s < TOTAL_SLOTS; s++) {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = slotToTimeStr(s, false);
                if (isSlotOccupied(s, activeModalTaskBlockId)) opt.disabled = true;
                if (s === activeModalTaskStartSlot) opt.selected = true;
                startSel.appendChild(opt);
            }

            if (activeModalTaskEndSlot < activeModalTaskStartSlot) {
                activeModalTaskEndSlot = activeModalTaskStartSlot;
            }
            activeModalTaskEndSlot = clampSlotRangeToEmpty(activeModalTaskStartSlot, activeModalTaskEndSlot, activeModalTaskBlockId);

            endSel.innerHTML = '';
            for (let e = activeModalTaskStartSlot; e < TOTAL_SLOTS; e++) {
                const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = slotToTimeStr(e, true);
                if (isRangeOverlapping(activeModalTaskStartSlot, e, activeModalTaskBlockId)) opt.disabled = true;
                if (e === activeModalTaskEndSlot) opt.selected = true;
                endSel.appendChild(opt);
            }
        }

        function setModalTaskTimeEnabled(enabled) {
            activeModalTaskHasTime = !!enabled;
            const addWrap = document.getElementById('modalTaskTimeAddWrap');
            const pickerWrap = document.getElementById('modalTaskTimePickerWrap');
            if (!addWrap || !pickerWrap) return;

            if (activeModalTaskHasTime) {
                if (isSlotOccupied(activeModalTaskStartSlot, activeModalTaskBlockId)) {
                    const now = new Date();
                    const approx = Math.min(TOTAL_SLOTS - 1, Math.max(0, now.getHours() * 6 + Math.floor(now.getMinutes() / 10)));
                    activeModalTaskStartSlot = findFirstAvailableSlot(approx, activeModalTaskBlockId);
                    activeModalTaskEndSlot = clampSlotRangeToEmpty(activeModalTaskStartSlot, Math.min(TOTAL_SLOTS - 1, activeModalTaskStartSlot + 5), activeModalTaskBlockId);
                }
                populateModalTaskTimeSelects();
                addWrap.classList.add('hidden');
                pickerWrap.classList.remove('hidden');
                pickerWrap.classList.add('grid');
            } else {
                addWrap.classList.remove('hidden');
                pickerWrap.classList.add('hidden');
                pickerWrap.classList.remove('grid');
            }
        }

        function handleModalTaskStartSlotChange(val) {
            const newStart = Number(val);
            if (isNaN(newStart) || isSlotOccupied(newStart, activeModalTaskBlockId)) return;
            const duration = Math.max(0, activeModalTaskEndSlot - activeModalTaskStartSlot);
            activeModalTaskStartSlot = newStart;
            activeModalTaskEndSlot = clampSlotRangeToEmpty(activeModalTaskStartSlot, Math.min(TOTAL_SLOTS - 1, newStart + duration), activeModalTaskBlockId);
            populateModalTaskTimeSelects();
        }

        function handleModalTaskEndSlotChange(val) {
            const newEnd = Number(val);
            if (isNaN(newEnd) || newEnd < activeModalTaskStartSlot) return;
            activeModalTaskEndSlot = clampSlotRangeToEmpty(activeModalTaskStartSlot, newEnd, activeModalTaskBlockId);
            populateModalTaskTimeSelects();
        }

        function openTaskModal(colKey, rowIdx) {
            const item = plannerState.columns[colKey][rowIdx];
            activeModalTaskRef = { colKey, rowIdx };
            document.getElementById('modalTaskTextInput').value = item.text || '';

            const linkedBlock = findLinkedTimeBlockForTask(colKey, rowIdx, item.text);
            if (linkedBlock) {
                activeModalTaskBlockId = linkedBlock.id;
                activeModalTaskStartSlot = linkedBlock.startSlot;
                activeModalTaskEndSlot = linkedBlock.endSlot;
                setModalTaskTimeEnabled(true);
            } else {
                activeModalTaskBlockId = null;
                const now = new Date();
                const approx = Math.min(TOTAL_SLOTS - 1, Math.max(0, now.getHours() * 6 + Math.floor(now.getMinutes() / 10)));
                activeModalTaskStartSlot = findFirstAvailableSlot(approx, null);
                activeModalTaskEndSlot = clampSlotRangeToEmpty(activeModalTaskStartSlot, Math.min(TOTAL_SLOTS - 1, activeModalTaskStartSlot + 5), null);
                setModalTaskTimeEnabled(false);
            }

            setModalRowType(item.rowType || 'task');
            setModalTaskDone(!!item.done);
            setModalTaskHighlight(normalizeColorHex(item.hl) || 'none');

            const clearBtn = document.getElementById('btnTaskModalClear');
            if (clearBtn) clearBtn.textContent = 'CLEAR';

            document.getElementById('taskModalBackdrop').classList.remove('hidden');
            setTimeout(() => {
                const input = document.getElementById('modalTaskTextInput');
                if (input) input.focus();
            }, 40);
        }

        function setModalRowType(type) {
            activeModalRowType = type === 'topic' ? 'topic' : 'task';
            document.getElementById('btnRowTypeTopic').className = activeModalRowType === 'topic' ? 'liquid-btn-active h-11 px-4 rounded-[12px] flex items-center justify-center font-semibold text-xs tracking-wider uppercase transition' : 'liquid-btn-inactive h-11 px-4 rounded-[12px] flex items-center justify-center font-semibold text-xs tracking-wider uppercase transition';
            document.getElementById('btnRowTypeTask').className = activeModalRowType === 'task' ? 'liquid-btn-active h-11 px-4 rounded-[12px] flex items-center justify-center font-semibold text-xs tracking-wider uppercase transition' : 'liquid-btn-inactive h-11 px-4 rounded-[12px] flex items-center justify-center font-semibold text-xs tracking-wider uppercase transition';
            document.getElementById('modalCompletionSection').classList.toggle('hidden', activeModalRowType === 'topic');
            document.getElementById('modalTaskTimeSection').classList.toggle('hidden', activeModalRowType === 'topic');
        }

        function setModalTaskDone(done) {
            activeModalTaskDone = done;
            document.getElementById('btnMarkDone').className = done ? 'liquid-btn-active h-11 px-4 rounded-[12px] flex items-center justify-center gap-1.5 font-semibold text-xs tracking-wider uppercase transition' : 'liquid-btn-inactive h-11 px-4 rounded-[12px] flex items-center justify-center gap-1.5 font-semibold text-xs tracking-wider uppercase transition';
            document.getElementById('btnMarkUndone').className = !done ? 'liquid-btn-active h-11 px-4 rounded-[12px] flex items-center justify-center gap-1.5 font-semibold text-xs tracking-wider uppercase transition' : 'liquid-btn-inactive h-11 px-4 rounded-[12px] flex items-center justify-center gap-1.5 font-semibold text-xs tracking-wider uppercase transition';
        }

        function setModalTaskHighlight(hl) {
            activeModalTaskHl = normalizeColorHex(hl);
            const noneBtn = document.getElementById('taskHlNoneBtn');
            if (noneBtn) {
                if (activeModalTaskHl === 'none') noneBtn.classList.add('ring-2', 'ring-offset-2', 'ring-slate-800');
                else noneBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-800');
            }
            renderAllPinnedColorBars();
        }

        function saveTaskModal() {
            if (!activeModalTaskRef) return;
            const { colKey, rowIdx } = activeModalTaskRef;
            const taskKey = `${colKey}-${rowIdx}`;
            const item = plannerState.columns[colKey][rowIdx];
            const newText = document.getElementById('modalTaskTextInput').value;

            item.rowType = activeModalRowType;
            item.text = newText;
            item.done = activeModalRowType === 'task' ? activeModalTaskDone : false;
            item.hl = activeModalTaskHl;

            const existingLinked = plannerState.timeBlocks.find(b => b.id === activeModalTaskBlockId || b.linkedTaskKey === taskKey);
            if (activeModalRowType === 'task' && activeModalTaskHasTime) {
                const startS = Math.min(activeModalTaskStartSlot, activeModalTaskEndSlot);
                const endS = clampSlotRangeToEmpty(startS, Math.max(activeModalTaskStartSlot, activeModalTaskEndSlot), activeModalTaskBlockId);
                if (!isSlotOccupied(startS, activeModalTaskBlockId)) {
                    const blockColor = (activeModalTaskHl && activeModalTaskHl !== 'none')
                        ? activeModalTaskHl
                        : ((existingLinked && existingLinked.color && existingLinked.color !== 'none') ? existingLinked.color : (pinnedColors[0] || '#93D5F6'));

                    if (existingLinked) {
                        plannerState.timeBlocks = plannerState.timeBlocks.filter(b => b.id !== existingLinked.id);
                    }
                    plannerState.timeBlocks.push({
                        id: (existingLinked && existingLinked.id) ? existingLinked.id : ('tb-' + Date.now()),
                        startSlot: startS,
                        endSlot: endS,
                        text: newText.trim(),
                        color: blockColor,
                        linkedTaskKey: taskKey
                    });
                }
            } else if (existingLinked) {
                plannerState.timeBlocks = plannerState.timeBlocks.filter(b => b.id !== existingLinked.id);
            }

            saveStateToStorage();
            closeTaskModal();
            renderMiddleRows();
            renderTimetable();
        }

        function clearModalTask() {
            if (!activeModalTaskRef) return;
            const { colKey, rowIdx } = activeModalTaskRef;
            const taskKey = `${colKey}-${rowIdx}`;

            // 1. 모달 내 모든 설정값(토픽/투두, 완료여부, 텍스트, 색연필, 시간)을 초기 상태로 리셋
            setModalRowType('task');
            setModalTaskDone(false);
            const textInput = document.getElementById('modalTaskTextInput');
            if (textInput) textInput.value = '';
            setModalTaskHighlight('none');
            setModalTaskTimeEnabled(false);

            // 2. 시트에 저장되어 있던 데이터 및 연결된 타임테이블 블록도 즉시 초기화
            plannerState.columns[colKey][rowIdx] = {
                rowType: 'task',
                text: '',
                done: false,
                hl: 'none'
            };
            plannerState.timeBlocks = plannerState.timeBlocks.filter(b => b.id !== activeModalTaskBlockId && b.linkedTaskKey !== taskKey);
            activeModalTaskBlockId = null;

            saveStateToStorage();
            renderMiddleRows();
            renderTimetable();

            const clearBtn = document.getElementById('btnTaskModalClear');
            if (clearBtn) {
                clearBtn.textContent = 'CLEARED ✓';
                setTimeout(() => { if (clearBtn) clearBtn.textContent = 'CLEAR'; }, 900);
            }
        }

        function closeTaskModal() {
            closeSpectrumPicker();
            document.getElementById('taskModalBackdrop').classList.add('hidden');
            activeModalTaskRef = null;
        }

        function openTimeBlockModalForRange(startS, endS, text = '', color = null, linkedTaskKey = null) {
            editingTimeBlockId = null;
            editingTimeBlockLinkedTaskKey = linkedTaskKey;
            activeTbStartSlot = Math.min(startS, endS);
            if (isSlotOccupied(activeTbStartSlot, null)) return;
            activeTbEndSlot = clampSlotRangeToEmpty(activeTbStartSlot, Math.max(startS, endS), null);
            populateTimeBlockSelects();
            document.getElementById('tbTextInput').value = text;
            setModalTimeBlockColor(color || pinnedColors[1]);
            document.getElementById('timeBlockModalBackdrop').classList.remove('hidden');
        }
        function openTimeBlockModalForExisting(blockId) {
            const block = plannerState.timeBlocks.find(b => b.id === blockId);
            if (!block) return;
            editingTimeBlockId = block.id;
            editingTimeBlockLinkedTaskKey = block.linkedTaskKey || null;
            activeTbStartSlot = block.startSlot;
            activeTbEndSlot = block.endSlot;
            populateTimeBlockSelects();
            document.getElementById('tbTextInput').value = block.text || '';
            setModalTimeBlockColor(block.color);
            document.getElementById('timeBlockModalBackdrop').classList.remove('hidden');
        }
        function populateTimeBlockSelects() {
            const startSel = document.getElementById('tbStartSlotSelect'), endSel = document.getElementById('tbEndSlotSelect');
            startSel.innerHTML = ''; endSel.innerHTML = '';
            for (let s = 0; s < TOTAL_SLOTS; s++) {
                const opt = document.createElement('option'); opt.value = s; opt.textContent = slotToTimeStr(s);
                if (isSlotOccupied(s, editingTimeBlockId)) opt.disabled = true;
                if (s === activeTbStartSlot) opt.selected = true;
                startSel.appendChild(opt);
            }
            if (activeTbEndSlot < activeTbStartSlot) activeTbEndSlot = activeTbStartSlot;
            activeTbEndSlot = clampSlotRangeToEmpty(activeTbStartSlot, activeTbEndSlot, editingTimeBlockId);
            for (let e = activeTbStartSlot; e < TOTAL_SLOTS; e++) {
                const opt = document.createElement('option'); opt.value = e; opt.textContent = slotToTimeStr(e, true);
                if (isRangeOverlapping(activeTbStartSlot, e, editingTimeBlockId)) opt.disabled = true;
                if (e === activeTbEndSlot) opt.selected = true;
                endSel.appendChild(opt);
            }
        }
        function handleTbStartSlotChange(val) {
            const newStart = Number(val);
            if (isNaN(newStart) || isSlotOccupied(newStart, editingTimeBlockId)) return;
            const duration = Math.max(0, activeTbEndSlot - activeTbStartSlot);
            activeTbStartSlot = newStart;
            activeTbEndSlot = clampSlotRangeToEmpty(activeTbStartSlot, Math.min(TOTAL_SLOTS - 1, newStart + duration), editingTimeBlockId);
            populateTimeBlockSelects();
        }
        function handleTbEndSlotChange(val) {
            const newEnd = Number(val);
            if (isNaN(newEnd) || newEnd < activeTbStartSlot) return;
            activeTbEndSlot = clampSlotRangeToEmpty(activeTbStartSlot, newEnd, editingTimeBlockId);
            populateTimeBlockSelects();
        }
        function setModalTimeBlockColor(c) {
            modalTimeBlockColor = normalizeColorHex(c);
            const noneBtn = document.getElementById('tbHlNoneBtn');
            if (noneBtn) {
                if (modalTimeBlockColor === 'none') noneBtn.classList.add('ring-2', 'ring-offset-2', 'ring-slate-800');
                else noneBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-800');
            }
            renderAllPinnedColorBars();
        }
        function saveTimeBlockModal() {
            const text = document.getElementById('tbTextInput').value.trim();
            if (editingTimeBlockId) plannerState.timeBlocks = plannerState.timeBlocks.filter(b => b.id !== editingTimeBlockId);
            if (text || modalTimeBlockColor !== 'none') {
                plannerState.timeBlocks.push({
                    id: editingTimeBlockId || ('tb-' + Date.now()),
                    startSlot: activeTbStartSlot,
                    endSlot: activeTbEndSlot,
                    text,
                    color: modalTimeBlockColor,
                    linkedTaskKey: editingTimeBlockLinkedTaskKey || null
                });
            }
            saveStateToStorage(); closeTimeBlockModal(); renderMiddleRows(); renderTimetable();
        }
        function deleteCurrentTimeBlock() {
            if (editingTimeBlockId) {
                plannerState.timeBlocks = plannerState.timeBlocks.filter(b => b.id !== editingTimeBlockId);
            }
            saveStateToStorage(); closeTimeBlockModal(); renderMiddleRows(); renderTimetable();
        }
        function closeTimeBlockModal() { closeSpectrumPicker(); document.getElementById('timeBlockModalBackdrop').classList.add('hidden'); renderTimetable(); }

        Object.assign(window, {
            openDatePickerModal, closeDatePickerModal, changeCalendarMonth, selectDateFromPicker, resetCurrentDatePage, getTodayDateKey,
            handleGoalChange, handleReviewChange, cancelTwoTapSelection,
            openTaskModal, closeTaskModal, setModalRowType, setModalTaskDone, setModalTaskHighlight,
            setModalTaskTimeEnabled, handleModalTaskStartSlotChange, handleModalTaskEndSlotChange,
            saveTaskModal, clearModalTask,
            handleTbStartSlotChange, handleTbEndSlotChange, setModalTimeBlockColor, saveTimeBlockModal, deleteCurrentTimeBlock, closeTimeBlockModal,
            triggerNativePicker, closeSpectrumPicker, handlePickerHexTyping
        });

        window.addEventListener('DOMContentLoaded', () => {
            initSpectrumPickerEvents();
            applyResponsiveLayoutMode();
            renderAllPinnedColorBars();
            switchSelectedDate(getTodayDateKey());
            initFirebaseCloudSync();
            const params = new URLSearchParams(window.location.search);
            const taskId = params.get('taskId');
            if (taskId && /^(left|right)-([0-9]|1[0-7])$/.test(taskId)) {
                const [col, r] = taskId.split('-');
                setTimeout(() => openTaskModal(col, Number(r)), 200);
            }
        });
    </script>
</body>
